name: CI

# Runs the deterministic, pure-Python design-core tests on every push / PR.
# These need no native toolchain (no SU2, gmsh, pyvista or ParaBlade), so the
# badge reflects the engineering correctness of the mean-line, blade-sizing and
# input-validation layers and is green without a heavy CI image.
#
# The full suite (geometry/ParaBlade, GMSH mesh, report rendering, and the
# SU2 CFD integration test) is run locally — see turbine_mcp/README.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: design-core tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (pure-Python design core)
        run: |
          python -m pip install --upgrade pip
          # Only what the design-core tests import: numpy (physics),
          # pydantic + mcp[cli] (the tool input layer), pytest.
          pip install numpy "pydantic>=2.0" "mcp[cli]>=1.2" "pytest>=7.0"

      - name: Run mean-line, blade and input-validation tests
        working-directory: turbine_mcp
        run: |
          python -m pytest -v \
            tests/test_meanline.py \
            tests/test_blade.py \
            tests/test_validation.py
